name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool pkg-config autoconf automake scons qemu-user-static locales openjdk-17-jdk-headless libffi-dev libssl-dev
        # Instalamos versiones estables específicas para evitar conflictos con el NDK moderno
        pip install --upgrade "buildozer>=1.5.0" wheel setuptools "cython<3.0.0" virtualenv

    - name: Generate Perfect Buildozer Spec
      run: |
        rm -f buildozer.spec
        cat << 'EOF' > buildozer.spec
        [app]
        title = Mi App Gym
        package.name = miappgym
        package.domain = org.ferpalacios
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json
        version = 0.1
        requirements = python3,kivy
        orientation = portrait
        fullscreen = 1
        
        android.api = 33
        android.minapi = 21
        android.ndk_api = 21
        # ESTA LÍNEA OBLIGA A USAR UN NDK COMPATIBLE:
        android.ndk = 25b
        android.archs = arm64-v8a, armeabi-v7a
        android.allow_backup = True
        
        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Build with Buildozer
      run: yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MiAppGimnasio
        path: bin/*.apk
