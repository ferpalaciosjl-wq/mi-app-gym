name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf automake libtool pkg-config scons qemu-user-static locales libffi-dev libssl-dev zip unzip
        pip install "cython>=0.29.33,<3.0.0" wheel setuptools==65.5.0 "buildozer==1.5.0" virtualenv

    - name: Generate Perfect Buildozer Spec
      run: |
        rm -f buildozer.spec
        cat << 'EOF' > buildozer.spec
        [app]
        title = Mi App Gym
        package.name = miappgym
        package.domain = org.ferpalacios
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json
        version = 0.1
        
        requirements = python3==3.10.11,kivy==2.3.0,hostpython3==3.10.11
        
        orientation = portrait
        fullscreen = 1
        
        # 🔑 PERMISOS CRÍTICOS: Esto le da permiso a la app para conectarse a GitHub
        android.permissions = INTERNET
        
        android.api = 33
        android.minapi = 21
        android.ndk_api = 21
        android.ndk = 25b
        android.archs = arm64-v8a
        android.allow_backup = True
        
        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MiAppGimnasio
        path: bin/*.apk
#patatus
